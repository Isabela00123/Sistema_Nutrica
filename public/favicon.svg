<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Gradient (Emerald to Teal) -->
    <linearGradient id="nutriGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <!-- Soft shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle / Rounded container like the app's logo -->
  <rect width="48" height="48" rx="14" fill="url(#nutriGrad)" filter="url(#glow)" />

  <!-- Sparkles Lucide Icon (Clean SVG paths) -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main Sparkle star -->
    <path d="M23 7c0 7.732-4.268 12-12 12 7.732 0 12 4.268 12 12 0-7.732 4.268-12 12-12-7.732 0-12-4.268-12-12Z" fill="#ffffff" fill-opacity="0.2" />
    <!-- Secondary small sparkle (top right) -->
    <path d="M36 25c0 3.314-1.686 5-5 5 3.314 0 5 1.686 5 5 0-3.314 1.686-5 5-5-3.314 0-5-1.686-5-5Z" fill="#ffffff" fill-opacity="0.25" stroke-width="2" />
    <!-- Small star / dot (bottom left) -->
    <circle cx="13" cy="35" r="1.5" fill="#ffffff" stroke="none" />
  </g>
</svg>